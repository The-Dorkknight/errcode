name: release

# Creates a GitHub PRE-release (the project is a work in progress) when a v* tag is pushed,
# or on demand from the Actions tab (Run workflow), so the Releases tab is populated even if
# GitHub Desktop did not push the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        default: "v0.2.0-wip"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "ErrCode $TAG (work in progress)" \
              --notes "Work-in-progress proof of concept. Many features may be broken. See CHANGELOG.md and the 'What exists and what does not' table in the README."
          fi
